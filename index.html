<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITCHLINE — نتائج مباشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --navy-950:#080b16;
  --navy-900:#0e1426;
  --navy-850:#121a30;
  --navy-800:#182140;
  --glass-fill:rgba(255,255,255,0.045);
  --glass-fill-hover:rgba(255,255,255,0.075);
  --glass-border:rgba(255,255,255,0.09);
  --emerald:#31e2a0;
  --emerald-dim:rgba(49,226,160,0.16);
  --violet:#9b87f5;
  --cyan:#3fc9ea;
  --amber:#f5b94d;
  --red:#f2596b;
  --text-hi:#f2f4f9;
  --text-mid:#aab2c8;
  --text-lo:#697190;
  --line:rgba(255,255,255,0.07);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --font-display:'Space Grotesk','Tajawal',sans-serif;
  --font-body:'Tajawal','Inter',sans-serif;
  --shadow-deep:0 20px 60px -20px rgba(0,0,0,0.65);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(155,135,245,0.14), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(49,226,160,0.10), transparent 55%),
    var(--navy-950);
  color:var(--text-hi);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.5;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}
::selection{background:var(--emerald); color:var(--navy-950);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--cyan); outline-offset:3px; border-radius:6px;}

.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.wrap{max-width:1280px; margin:0 auto; padding:0 clamp(18px,4vw,48px);}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  backdrop-filter:blur(18px) saturate(140%);
  background:rgba(8,11,22,0.72);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px clamp(18px,4vw,48px);
  max-width:1280px; margin:0 auto;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:38px; height:38px; border-radius:11px;
  background:linear-gradient(135deg,var(--emerald),var(--cyan));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 22px -6px rgba(49,226,160,0.55);
}
.brand-mark svg{width:20px; height:20px;}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text b{font-family:var(--font-display); font-size:19px; letter-spacing:0.3px;}
.brand-text span{font-size:11px; color:var(--text-lo); font-weight:500;}

.live-pill{
  display:flex; align-items:center; gap:8px;
  background:var(--emerald-dim);
  border:1px solid rgba(49,226,160,0.35);
  color:var(--emerald);
  padding:8px 16px; border-radius:999px;
  font-size:13px; font-weight:700;
}
.live-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--emerald);
  box-shadow:0 0 0 0 rgba(49,226,160,0.6);
  animation:pulseDot 1.8s ease-out infinite;
}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(49,226,160,0.55);}
  70%{box-shadow:0 0 0 9px rgba(49,226,160,0);}
  100%{box-shadow:0 0 0 0 rgba(49,226,160,0);}
}

/* ---------- Hero ---------- */
.hero{padding:56px 0 20px;}
.hero-top{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:24px; flex-wrap:wrap; margin-bottom:30px;
}
.hero-heading{max-width:640px;}
.eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; color:var(--text-lo); font-size:13px; font-weight:600;}
.eyebrow-row .dash{width:22px; height:1px; background:var(--text-lo);}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(30px,4.6vw,50px);
  font-weight:700;
  line-height:1.08;
  letter-spacing:-0.5px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(90deg,var(--emerald),var(--cyan));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{color:var(--text-mid); font-size:15.5px; margin-top:14px; max-width:52ch;}

.refresh-chip{
  display:flex; align-items:center; gap:10px;
  background:var(--glass-fill); border:1px solid var(--glass-border);
  padding:10px 16px; border-radius:999px; color:var(--text-mid); font-size:13px;
  white-space:nowrap;
}
.refresh-chip b{color:var(--text-hi);}
.refresh-chip .refresh-btn{
  width:30px; height:30px; border-radius:50%; border:none;
  background:var(--glass-fill-hover); color:var(--text-hi);
  display:flex; align-items:center; justify-content:center;
  transition:transform .5s ease, background .2s ease;
}
.refresh-chip .refresh-btn:hover{background:rgba(63,201,234,0.22);}
.refresh-chip .refresh-btn.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Featured matches: horizontal scroll cards ---------- */
.featured-scroller{
  display:flex; gap:18px; overflow-x:auto; padding:8px 4px 22px;
  scroll-snap-type:x proximity;
}
.featured-scroller::-webkit-scrollbar{height:6px;}
.featured-scroller::-webkit-scrollbar-thumb{background:var(--glass-border); border-radius:99px;}

.match-card{
  scroll-snap-align:start;
  flex:0 0 300px;
  background:linear-gradient(180deg,var(--glass-fill), rgba(255,255,255,0.015));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:20px;
  backdrop-filter:blur(14px);
  position:relative; overflow:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s ease, box-shadow .28s ease;
}
.match-card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(135deg,rgba(155,135,245,0.35),transparent 40%,rgba(49,226,160,0.25));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0; transition:opacity .28s ease; pointer-events:none;
}
.match-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,0.16);
  box-shadow:var(--shadow-deep);
}
.match-card:hover::before{opacity:1;}

.match-card .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.league-tag{
  font-size:11px; font-weight:700; color:var(--violet);
  background:rgba(155,135,245,0.14); border:1px solid rgba(155,135,245,0.3);
  padding:4px 10px; border-radius:99px;
  max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.status-badge{
  font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;
  display:flex; align-items:center; gap:6px;
}
.status-live{background:var(--emerald-dim); color:var(--emerald); border:1px solid rgba(49,226,160,0.35);}
.status-ft{background:rgba(255,255,255,0.05); color:var(--text-lo); border:1px solid var(--glass-border);}
.status-ns{background:rgba(63,201,234,0.1); color:var(--cyan); border:1px solid rgba(63,201,234,0.28);}
.status-live .live-dot-sm{width:6px; height:6px; border-radius:50%; background:var(--emerald); animation:pulseDot 1.8s ease-out infinite;}

.teams-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.team{display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; min-width:0;}
.team-badge{
  width:44px; height:44px; border-radius:12px;
  background:linear-gradient(150deg,var(--navy-800),var(--navy-850));
  border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text-mid);
}
.team-name{font-size:12.5px; font-weight:600; text-align:center; color:var(--text-hi); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.score-block{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:30px; font-weight:700; padding:0 6px;}
.score-block .sep{color:var(--text-lo); font-size:18px; font-weight:500;}
.score-live{color:var(--emerald); text-shadow:0 0 18px rgba(49,226,160,0.45);}

.card-foot{margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-lo);}

/* ---------- Section headers ---------- */
.section{padding:34px 0;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.section-head h2{font-family:var(--font-display); font-size:24px; font-weight:600;}
.section-head p{color:var(--text-lo); font-size:13.5px;}

/* ---------- League groups / results table ---------- */
.league-group{
  margin-bottom:16px;
  background:var(--glass-fill);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.league-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:15px 20px; cursor:pointer;
  transition:background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.league-header:hover{background:var(--glass-fill-hover);}
.league-header-left{display:flex; align-items:center; gap:12px;}
.league-dot{width:9px; height:9px; border-radius:3px; background:linear-gradient(135deg,var(--violet),var(--cyan));}
.league-header h3{font-size:15px; font-weight:700;}
.league-count{font-size:12px; color:var(--text-lo); background:rgba(255,255,255,0.05); padding:2px 9px; border-radius:99px;}
.chevron{transition:transform .25s ease; color:var(--text-lo);}
.league-group.open .chevron{transform:rotate(180deg);}

.league-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
.league-group.open .league-body{max-height:2000px;}

.result-row{
  display:grid;
  grid-template-columns:64px 1fr auto 1fr 90px;
  align-items:center; gap:12px;
  padding:13px 20px;
  border-top:1px solid var(--line);
  font-size:13.5px;
  transition:background .2s ease;
}
.result-row:hover{background:rgba(255,255,255,0.03);}
.result-time{color:var(--text-lo); font-size:12px; text-align:center;}
.result-team{display:flex; align-items:center; gap:10px; min-width:0;}
.result-team.away{flex-direction:row-reverse; text-align:left;}
.result-team span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
.result-badge{
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  background:var(--navy-800); border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:var(--text-mid);
}
.result-score{
  font-family:var(--font-display); font-weight:700; font-size:15px;
  display:flex; align-items:center; gap:6px; justify-content:center; min-width:60px;
}
.result-status{display:flex; justify-content:flex-end;}

@media (max-width:640px){
  .result-row{grid-template-columns:44px 1fr 60px 1fr;}
  .result-status{display:none;}
  .result-team span{font-size:12.5px;}
}

/* ---------- Skeleton loading ---------- */
.skel{position:relative; overflow:hidden; background:var(--glass-fill);}
.skel::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  transform:translateX(-100%);
  animation:shimmer 1.6s infinite;
}
@keyframes shimmer{100%{transform:translateX(100%);}}
.skel-card{flex:0 0 300px; height:196px; border-radius:var(--radius-lg); border:1px solid var(--glass-border);}
.skel-row{height:52px; border-radius:var(--radius-sm); margin:10px 20px;}

/* ---------- Empty / error state ---------- */
.state-panel{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
  padding:52px 24px; border:1px dashed var(--glass-border); border-radius:var(--radius-lg);
  color:var(--text-mid);
}
.state-panel .icon-ring{
  width:56px; height:56px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(242,89,107,0.12); border:1px solid rgba(242,89,107,0.3); color:var(--red);
}
.state-panel h3{color:var(--text-hi); font-family:var(--font-display); font-size:18px; font-weight:600;}
.state-panel p{max-width:44ch; font-size:13.5px;}
.retry-btn{
  margin-top:6px; padding:10px 22px; border-radius:99px; border:none;
  background:linear-gradient(90deg,var(--emerald),var(--cyan)); color:var(--navy-950);
  font-weight:700; font-size:13.5px; transition:transform .2s ease, box-shadow .2s ease;
}
.retry-btn:hover{transform:translateY(-2px); box-shadow:0 10px 26px -8px rgba(49,226,160,0.5);}

/* ---------- Footer ---------- */
footer{padding:30px 0 60px; border-top:1px solid var(--line); margin-top:20px;}
.footer-inner{display:flex; justify-content:center; flex-wrap:wrap; gap:10px; color:var(--text-lo); font-size:17px;}

/* ---------- Toast notifications (bottom-left, floating) ---------- */
.toast-stack{
  position:fixed; left:20px; bottom:20px; z-index:100;
  display:flex; flex-direction:column-reverse; gap:10px;
  width:min(320px, calc(100vw - 40px));
}
.toast{
  display:flex; align-items:flex-start; gap:12px;
  background:rgba(14,20,38,0.85);
  backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-border);
  border-radius:14px; padding:13px 14px;
  box-shadow:var(--shadow-deep);
  animation:toastIn .35s cubic-bezier(.2,.9,.25,1);
}
.toast.leaving{animation:toastOut .3s ease forwards;}
@keyframes toastIn{from{opacity:0; transform:translateY(14px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes toastOut{to{opacity:0; transform:translateX(-16px) scale(0.96);}}
.toast-icon{
  width:30px; height:30px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--emerald-dim); color:var(--emerald);
}
.toast.type-error .toast-icon{background:rgba(242,89,107,0.14); color:var(--red);}
.toast.type-info .toast-icon{background:rgba(63,201,234,0.12); color:var(--cyan);}
.toast-body b{display:block; font-size:13px; font-weight:700; margin-bottom:2px;}
.toast-body span{font-size:12px; color:var(--text-mid); line-height:1.4;}
.toast-close{margin-right:auto; margin-left:0; background:none; border:none; color:var(--text-lo); font-size:16px; line-height:1; padding:2px;}

@media (max-width:520px){
  .toast-stack{left:12px; right:12px; width:auto;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#080b16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/></svg>
      </div>
      <div class="brand-text">
        <b>Hazem Koora</b>
        <span>نتائج مباشرة لحظة بلحظة</span>
      </div>
    </div>
    <div class="live-pill">
      <span class="live-dot"></span>
      <span id="liveCount">0 مباراة مباشرة</span>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-top">
      <div class="hero-heading">
        <div class="eyebrow-row"><span class="dash"></span> لوحة المتابعة</div>
        <h1>كل الملاعب، <em>نتيجة واحدة</em> في نفس اللحظة</h1>
        <p>تابع المباريات البارزة والنتائج اليومية لجميع الدوريات مجمّعة في مكان واحد، بتحديث تلقائي كل 30 ثانية.</p>
      </div>
      <div class="refresh-chip">
        <span>آخر تحديث: <b id="lastUpdated">—</b></span>
        <button class="refresh-btn" id="refreshBtn" aria-label="تحديث البيانات الآن">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="featured-scroller" id="featuredScroller">
      <!-- filled by JS -->
    </div>
  </section>

  <section class="section" id="resultsSection">
    <div class="section-head">
      <h2>جدول نتائج اليوم</h2>
      <p id="resultsMeta">مقسّمة حسب الدوري</p>
    </div>
    <div id="leaguesContainer">
      <!-- filled by JS -->
    </div>
  </section>

</main>

<footer>
  <div class="wrap footer-inner">
    <span>Developed by eng. Hazem Mohamed</span>
  </div>
</footer>

<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WEBHOOK_URL = "https://hazem-n8n-gomma.app.n8n.cloud/webhook-test/e10df1cf-9fb5-4456-a561-3339ed5f85c2";
const REFRESH_INTERVAL_MS = 30000; // 30s auto refresh

let currentMatches = [];
let prevMatchesById = new Map();
let refreshTimer = null;

/* ============================================================
   HELPERS: normalize incoming fields
   n8n / Sheets payloads sometimes vary in key casing/spacing,
   so we read defensively across a few likely variants.
   ============================================================ */
function pick(obj, keys, fallback) {
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
  }
  return fallback;
}

function normalizeMatch(raw) {
  return {
    id: String(pick(raw, ["id", "Match ID", "match_id"], cryptoRandomId())),
    league: pick(raw, ["league", "League"], "دوري غير معروف"),
    home: pick(raw, ["homeTeam", "home", "Home Team", "HomeTeam"], "فريق مضيف"),
    away: pick(raw, ["awayTeam", "away", "Away Team", "AwayTeam"], "فريق ضيف"),
    homeScore: pick(raw, ["homeScore", "Home Score", "home_score"], null),
    awayScore: pick(raw, ["awayScore", "Away Score", "away_score"], null),
    status: String(pick(raw, ["status", "Status"], "NS")).trim(),
    date: pick(raw, ["matchDate", "Match Date", "date"], ""),
    homeLogo: pick(raw, ["homeLogo", "Home Logo", "homelogo"], ""),
    awayLogo: pick(raw, ["awayLogo", "Away Logo", "awaylogo"], "")
  };
}

function cryptoRandomId() {
  return "m_" + Math.random().toString(36).slice(2, 10);
}

/* status classification: FT, NS, or a live minute (numeric-ish string) */
function classifyStatus(status) {
  const s = (status || "").trim().toUpperCase();
  if (s === "FT") return { kind: "ft", label: "انتهت" };
  if (s === "NS") return { kind: "ns", label: "لم تبدأ" };
  const numeric = s.replace("'", "").replace("+", "");
  if (/^\d+$/.test(numeric)) return { kind: "live", label: `الدقيقة ${numeric}'` };
  return { kind: "ns", label: s || "—" };
}

function initials(name) {
  return (name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

function scoreDisplay(v) {
  return (v === null || v === undefined || v === "") ? "-" : v;
}

/* ============================================================
   RENDER: skeletons
   ============================================================ */
function renderSkeletons() {
  const scroller = document.getElementById("featuredScroller");
  scroller.innerHTML = Array.from({ length: 4 }).map(() =>
    `<div class="skel skel-card"></div>`
  ).join("");

  const container = document.getElementById("leaguesContainer");
  container.innerHTML = Array.from({ length: 2 }).map(() => `
    <div class="league-group open">
      <div class="league-header">
        <div class="league-header-left">
          <div class="skel" style="width:9px;height:9px;border-radius:3px;"></div>
          <div class="skel" style="width:140px;height:14px;border-radius:6px;"></div>
        </div>
      </div>
      <div class="league-body" style="max-height:400px;">
        ${Array.from({ length: 3 }).map(() => `<div class="skel skel-row"></div>`).join("")}
      </div>
    </div>
  `).join("");
}

/* ============================================================
   RENDER: featured cards
   ============================================================ */
function renderFeatured(matches) {
  const scroller = document.getElementById("featuredScroller");

  if (!matches.length) {
    scroller.innerHTML = `<div style="color:var(--text-lo); font-size:13.5px; padding:20px 4px;">لا توجد مباريات بارزة متاحة حالياً.</div>`;
    return;
  }

  // Prioritize live matches, then upcoming, then finished — cap at 8 cards
  const rank = m => classifyStatus(m.status).kind === "live" ? 0 : classifyStatus(m.status).kind === "ns" ? 1 : 2;
  const featured = [...matches].sort((a, b) => rank(a) - rank(b)).slice(0, 8);

  scroller.innerHTML = featured.map(m => {
    const st = classifyStatus(m.status);
    const badgeClass = st.kind === "live" ? "status-live" : st.kind === "ft" ? "status-ft" : "status-ns";
    const dotHtml = st.kind === "live" ? `<span class="live-dot-sm"></span>` : "";
    const scoreClass = st.kind === "live" ? "score-live" : "";
    return `
      <article class="match-card">
        <div class="card-top">
          <span class="league-tag" title="${escapeHtml(m.league)}">${escapeHtml(m.league)}</span>
          <span class="status-badge ${badgeClass}">${dotHtml}${st.label}</span>
        </div>
        <div class="teams-row">
          <div class="team">
            <div class="team-badge">${initials(m.home)}</div>
            <div class="team-name" title="${escapeHtml(m.home)}">${escapeHtml(m.home)}</div>
          </div>
          <div class="score-block num ${scoreClass}">
            <span>${scoreDisplay(m.homeScore)}</span>
            <span class="sep">:</span>
            <span>${scoreDisplay(m.awayScore)}</span>
          </div>
          <div class="team">
            <div class="team-badge">${initials(m.away)}</div>
            <div class="team-name" title="${escapeHtml(m.away)}">${escapeHtml(m.away)}</div>
          </div>
        </div>
        <div class="card-foot">
          <span>#${escapeHtml(m.id)}</span>
          <span>${formatDate(m.date)}</span>
        </div>
      </article>
    `;
  }).join("");
}

/* ============================================================
   RENDER: results grouped by league
   ============================================================ */
function renderLeagueGroups(matches) {
  const container = document.getElementById("leaguesContainer");
  const metaEl = document.getElementById("resultsMeta");

  if (!matches.length) {
    container.innerHTML = "";
    metaEl.textContent = "لا توجد نتائج لعرضها";
    return;
  }

  const groups = new Map();
  for (const m of matches) {
    const key = m.league || "غير مصنّف";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(m);
  }

  metaEl.textContent = `${groups.size} دوري · ${matches.length} مباراة`;

  const html = [...groups.entries()].map(([league, list], idx) => {
    const rows = list.map(m => {
      const st = classifyStatus(m.status);
      const badgeClass = st.kind === "live" ? "status-live" : st.kind === "ft" ? "status-ft" : "status-ns";
      const dotHtml = st.kind === "live" ? `<span class="live-dot-sm"></span>` : "";
      return `
        <div class="result-row">
          <div class="result-time">${formatTime(m.date)}</div>
          <div class="result-team">
            <div class="result-badge">${initials(m.home)}</div>
            <span title="${escapeHtml(m.home)}">${escapeHtml(m.home)}</span>
          </div>
          <div class="result-score num">${scoreDisplay(m.homeScore)} : ${scoreDisplay(m.awayScore)}</div>
          <div class="result-team away">
            <div class="result-badge">${initials(m.away)}</div>
            <span title="${escapeHtml(m.away)}">${escapeHtml(m.away)}</span>
          </div>
          <div class="result-status"><span class="status-badge ${badgeClass}">${dotHtml}${st.label}</span></div>
        </div>
      `;
    }).join("");

    return `
      <div class="league-group ${idx === 0 ? "open" : ""}" data-league="${escapeHtml(league)}">
        <div class="league-header" onclick="toggleLeague(this)">
          <div class="league-header-left">
            <span class="league-dot"></span>
            <h3>${escapeHtml(league)}</h3>
            <span class="league-count">${list.length}</span>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="league-body">${rows}</div>
      </div>
    `;
  }).join("");

  container.innerHTML = html;
}

function toggleLeague(headerEl) {
  headerEl.parentElement.classList.toggle("open");
}
window.toggleLeague = toggleLeague;

/* ============================================================
   ERROR STATE
   ============================================================ */
function renderError(message) {
  const scroller = document.getElementById("featuredScroller");
  scroller.innerHTML = "";
  const container = document.getElementById("leaguesContainer");
  container.innerHTML = `
    <div class="state-panel">
      <div class="icon-ring">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      </div>
      <h3>تعذّر الاتصال بمصدر البيانات</h3>
      <p>${escapeHtml(message)}</p>
      <button class="retry-btn" onclick="fetchMatches()">إعادة المحاولة</button>
    </div>
  `;
  document.getElementById("resultsMeta").textContent = "فشل التحميل";
}

/* ============================================================
   TOASTS
   ============================================================ */
function showToast({ type = "info", title, message, timeout = 5000 }) {
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = `toast type-${type}`;
  const icon = type === "error"
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>`
    : type === "info"
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>`;

  el.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <b>${escapeHtml(title)}</b>
      <span>${escapeHtml(message)}</span>
    </div>
    <button class="toast-close" aria-label="إغلاق">&times;</button>
  `;
  el.querySelector(".toast-close").onclick = () => dismissToast(el);
  stack.appendChild(el);
  if (timeout) setTimeout(() => dismissToast(el), timeout);
}

function dismissToast(el) {
  if (!el || !el.parentElement) return;
  el.classList.add("leaving");
  setTimeout(() => el.remove(), 280);
}

/* Compare new vs previous matches to surface live events as toasts */
function diffAndNotify(newMatches) {
  if (prevMatchesById.size > 0) {
    for (const m of newMatches) {
      const prev = prevMatchesById.get(m.id);
      if (!prev) continue;
      if (String(prev.homeScore) !== String(m.homeScore) || String(prev.awayScore) !== String(m.awayScore)) {
        showToast({
          type: "success",
          title: "هدف! ⚽",
          message: `${m.home} ${scoreDisplay(m.homeScore)} - ${scoreDisplay(m.awayScore)} ${m.away}`
        });
      } else if (classifyStatus(prev.status).kind !== "ft" && classifyStatus(m.status).kind === "ft") {
        showToast({
          type: "info",
          title: "انتهت المباراة",
          message: `${m.home} ${scoreDisplay(m.homeScore)} - ${scoreDisplay(m.awayScore)} ${m.away}`
        });
      }
    }
  }
  prevMatchesById = new Map(newMatches.map(m => [m.id, m]));
}

/* ============================================================
   FORMATTERS
   ============================================================ */
function formatDate(raw) {
  if (!raw) return "—";
  const d = new Date(raw);
  if (isNaN(d)) return raw;
  return d.toLocaleDateString("ar-EG", { day: "2-digit", month: "short" });
}
function formatTime(raw) {
  if (!raw) return "—";
  const d = new Date(raw);
  if (isNaN(d)) return "—";
  return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* ============================================================
   CORE: fetchMatches — GET request to the n8n webhook
   ============================================================ */
async function fetchMatches({ silent = false } = {}) {
  const refreshBtn = document.getElementById("refreshBtn");
  refreshBtn.classList.add("spinning");

  if (!silent) renderSkeletons();

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error(`طلب الشبكة فشل برمز الحالة ${response.status}`);
    }

    const data = await response.json();

    // Accept either a raw array, or an object wrapping the array (common n8n shapes)
    const list = Array.isArray(data)
      ? data
      : Array.isArray(data?.matches) ? data.matches
      : Array.isArray(data?.data) ? data.data
      : Array.isArray(data?.[0]?.json) ? data.map(x => x.json)
      : null;

    if (!list) throw new Error("شكل البيانات المستلمة من الـ Webhook غير متوقع.");

    const matches = list.map(normalizeMatch);
    currentMatches = matches;

    diffAndNotify(matches);
    renderFeatured(matches);
    renderLeagueGroups(matches);
    updateLiveCount(matches);
    setLastUpdated();

  } catch (err) {
    console.error("fetchMatches error:", err);
    renderError(err.message || "حدث خطأ غير متوقع أثناء جلب البيانات.");
    showToast({
      type: "error",
      title: "فشل تحديث البيانات",
      message: "تعذّر الوصول إلى الخادم، سيُعاد المحاولة تلقائياً.",
      timeout: 6000
    });
  } finally {
    refreshBtn.classList.remove("spinning");
  }
}
window.fetchMatches = fetchMatches;

function updateLiveCount(matches) {
  const liveCount = matches.filter(m => classifyStatus(m.status).kind === "live").length;
  document.getElementById("liveCount").textContent = `${liveCount} مباراة مباشرة`;
}

function setLastUpdated() {
  const now = new Date();
  document.getElementById("lastUpdated").textContent =
    now.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById("refreshBtn").addEventListener("click", () => fetchMatches());

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => fetchMatches({ silent: true }), REFRESH_INTERVAL_MS);
}

fetchMatches();
startAutoRefresh();

showToast({
  type: "info",
  title: "مرحباً بك 👋",
  message: "يتم تحديث النتائج تلقائياً كل 30 ثانية.",
  timeout: 4500
});
</script>
